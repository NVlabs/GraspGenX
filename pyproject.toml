[build-system]
requires = ["setuptools>=45,<78", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "graspgenx"
version = "1.0.0"
description = "GraspGenX: Cross-Embodiment Diffusion-based 6-DOF Grasp Generation"
authors = [
    {name = "Adithya Murali", email = "admurali@nvidia.com"},
]
maintainers = [
    {name = "Adithya Murali", email = "admurali@nvidia.com"},
]
license = {text = "NVIDIA Corporation"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["robotics", "manipulation", "learning", "computer-vision", "grasping", "cross-embodiment"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core PyTorch dependencies. Floor pin only — we verified the codebase
    # runs on torch 2.9 (CUDA 13 / Blackwell) as well as 2.1.0, so we do not
    # lock to one framework/CUDA wheel. Python 3.12 requires torch >=2.2.
    "torch>=2.1,<3",
    # Runtime dependencies for eager PyTorch inference. Training, rendering,
    # tests, serving, and the optimized TensorRT/CUDA path are optional below.
    "omegaconf",
    "numpy==1.26.4",
    "scipy",
    "trimesh==4.5.3",
    "diffusers==0.11.1",
    "huggingface-hub==0.25.2",
    "addict",
    "tqdm",
    "pyyaml",

    # NOTE: the end-to-end pick-and-place pipeline (end2end/) needs a heavier
    # sim + motion-planning stack (cuRobo, Newton, MuJoCo, CoACD, USD, fcl).
    # Those are NOT part of the base inference install — they live in the
    # optional `end2end` extra below. Install them with:
    #     uv sync --extra end2end        (or:  uv pip install -e ".[end2end]")
]

[project.urls]
"Homepage" = "https://graspgenx.github.io"
"Repository" = "https://github.com/balakumar-s/GraspGenX"
"Documentation" = "https://graspgenx.github.io"

[project.scripts]
graspgenx-install-fast-inference = "graspgenx.fast_inference.install:main"

[project.optional-dependencies]
# One-command native-runtime installation dependencies. Eager PyTorch inference
# is part of the base package and does not require this extra.
fast-inference = [
    "cmake>=3.24",
    "ninja>=1.11",
    "tensorrt-cu13-bindings==10.13.3.9",
    "ml-dtypes==0.5.4; python_version < '3.13'",
    "onnx==1.21.0; python_version < '3.13'",
    "onnxscript==0.7.1; python_version < '3.13'",
]
# Dataset and training utilities. The released PTV3 inference path does not
# require these packages.
training = [
    "hydra-core",
    "torchvision>=0.16,<0.22",
    "h5py",
    "webdataset",
    "scikit-learn",
    "imageio",
    "yourdfpy==0.0.56",
    "scene-synthesizer",  # large-scale evaluation scene construction
    "matplotlib",
    "tensorboard",
]
# Interactive demos and offline rendering are independent of model inference.
visualization = [
    "PyOpenGL==3.1.5",
    "pyrender",
    # Used for USD mesh loading and synthetic-scene construction. The
    # `recommend` extra also installs unused dm-control; usd-core is explicit.
    "scene-synthesizer",
    "usd-core",
    "viser",
    "yourdfpy==0.0.56",
]
# End-to-end pick-and-place pipeline (end2end/): GraspGenX -> cuRobo motion
# planning -> Newton/MuJoCo dynamic playback -> MP4 render / USD export.
# Install with: uv sync --extra end2end
end2end = [
    "nvidia-curobo",          # motion planning
    "newton[sim]",            # physics sim; pulls warp
    "mujoco-warp==3.5.0.2",   # SolverMuJoCo backend (pinned: 3.8 broke geom_dataid)
    "mujoco==3.5.0",          # matching enum API
    "coacd>=1.0.7",           # convex decomposition for object/gripper collision
    "usd-core",               # USD export (export_trajectory_usd.py)
    "python-fcl",             # mesh-vs-scene collision checks (grasp filtering/viz)
    "scene-synthesizer",      # scene construction (scene_builder.py, registry.py)
    "yourdfpy==0.0.56",       # URDF parsing and visual FK
    "PyOpenGL==3.1.5",        # pyrender EGL compatibility pin
    "pyrender",               # MP4 rendering
    "viser",                  # interactive trajectory visualization
]
dev = [
    "black",
    "isort",
    "flake8",
    "pytest",
]
serve = [
    "pyzmq",
    "msgpack",
    "msgpack-numpy",
]
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["graspgenx*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.txt", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring a live GraspGenX server or GPU",
    "end2end: slow end-to-end pick-and-place demos (GPU + cuRobo + Newton)",
    "tensorrt: tests requiring CUDA and the native C++ TensorRT runtime",
]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88
