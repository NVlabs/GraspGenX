name: ur10e_robotiq_2f_140
# UR10e + Robotiq 2F-140: one revolute master `finger_joint` with five mimic
# followers (see UR10eRobotiq2F140Profile in end2end/robot_profiles.py).
profile: ur10e_robotiq_2f_140
curobo:
  robot_config: ../curobo_assets/ur10e_robotiq_2f_140.yml
  tool_frame: tool0
  default_joint_position:
  - 0.0
  - -2.2
  - 1.9
  - -1.383
  - -1.57
  - 0.0
graspgen:
  gripper_name: robotiq_2f_140
grasp_to_tool_transform:
  # The gripper is mounted on tool0 with an identity transform
  # (build_ur10e_gripper.py --mount_rpy 0 0 0), so tool0 coincides with
  # robotiq_arg2f_base_link and +Z is the approach axis. In the
  # gripper_descriptions URDF, world_joint rotates robotiq_arg2f_base_link by
  # 1.57 rad about Z relative to the GraspGenX grasp frame (closing axis +X),
  # so tool0 = grasp @ Rz(1.57). Without this offset the fingers close 90°
  # off the predicted grasp axis.
  translation:
  - 0.0
  - 0.0
  - 0.0
  quaternion_xyzw:
  - 0.0
  - 0.0
  - 0.706825
  - 0.707388
robot_base_pose:
  translation:
  - 0.0
  - 0.0
  - 0.3
  quaternion_xyzw:
  - 0.0
  - 0.0
  - 0.0
  - 1.0
# Merged UR10e + robotiq_2f_140 URDF, generated by build_ur10e_gripper.py into
# the gitignored end2end/curobo_assets/ dir. ${E2E} = this end2end/ directory.
urdf_path: ${E2E}/curobo_assets/ur10e_robotiq_2f_140.urdf
asset_root_path: ${E2E}/curobo_assets
# cuRobo plans for tool0 (the only tool frame in the generated cuRobo YAML).
tool_frame: tool0
default_arm_q:
- 0.0
- -2.2
- 1.9
- -1.383
- -1.57
- 0.0
dynamic:
  arm_kp: 2000.0
  arm_kd: 100.0
